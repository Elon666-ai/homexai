<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录成功 - HomeX AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounceIn 0.6s ease-out;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 32px;
        }

        .message {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.6;
        }

        .provider-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .provider-google {
            background: #e8f0fe;
            color: #1967d2;
        }

        .provider-facebook {
            background: #e7f3ff;
            color: #1877f2;
        }

        .provider-icon {
            width: 20px;
            height: 20px;
        }

        .user-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: left;
        }

        .user-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .user-field {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 10px;
            background: white;
            border-radius: 6px;
        }

        .user-field label {
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }

        .user-field span {
            color: #333;
            font-size: 14px;
        }

        .token-section {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .token-section h4 {
            color: #856404;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .token-display {
            background: white;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            color: #333;
            max-height: 100px;
            overflow-y: auto;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>
        <h1>登录成功！</h1>
        <p class="message">欢迎来到 HomeX AI 智能家居管理平台</p>

        <div id="providerBadge" class="provider-badge"></div>

        <div class="user-card" id="userCard" style="display: none;">
            <h3>👤 您的账户信息</h3>
            <div class="user-field">
                <label>姓名:</label>
                <span id="userName">加载中...</span>
            </div>
            <div class="user-field">
                <label>邮箱:</label>
                <span id="userEmail">加载中...</span>
            </div>
            <div class="user-field">
                <label>用户ID:</label>
                <span id="userId">加载中...</span>
            </div>
            <div class="user-field">
                <label>登录方式:</label>
                <span id="userProvider">加载中...</span>
            </div>
        </div>

        <div class="token-section">
            <h4>🔑 您的认证令牌 (已自动保存)</h4>
            <div class="token-display" id="tokenDisplay">加载中...</div>
        </div>

        <div class="button-group">
            <button class="btn btn-primary" id="continueBtn">继续使用</button>
            <button class="btn btn-secondary" id="copyTokenBtn">复制Token</button>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080';

        function getTokenFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('token');
        }

        function getProviderFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('provider') || 'unknown';
        }

        function saveToken(token) {
            localStorage.setItem('auth_token', token);
        }

        function updateProviderBadge(provider) {
            const badge = document.getElementById('providerBadge');
            
            if (provider === 'google') {
                badge.className = 'provider-badge provider-google';
                badge.innerHTML = `
                    <svg class="provider-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Google 账户登录
                `;
            } else if (provider === 'facebook') {
                badge.className = 'provider-badge provider-facebook';
                badge.innerHTML = `
                    <svg class="provider-icon" viewBox="0 0 24 24">
                        <path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                    Facebook 账户登录
                `;
            }
        }

        async function loadUserProfile(token) {
            try {
                const response = await fetch(`${API_BASE}/api/profile`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    displayUserInfo(data.user);
                } else {
                    console.error('Failed to load profile');
                }
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }

        function displayUserInfo(user) {
            document.getElementById('userName').textContent = user.name || 'N/A';
            document.getElementById('userEmail').textContent = user.email || 'N/A';
            document.getElementById('userId').textContent = user.id || 'N/A';
            document.getElementById('userProvider').textContent = 
                user.provider === 'google' ? 'Google' : 'Facebook';
            document.getElementById('userCard').style.display = 'block';
        }

        document.getElementById('continueBtn').addEventListener('click', () => {
            window.location.href = '/';
        });

        document.getElementById('copyTokenBtn').addEventListener('click', () => {
            const token = getTokenFromURL();
            if (token) {
                navigator.clipboard.writeText(token).then(() => {
                    const btn = document.getElementById('copyTokenBtn');
                    const originalText = btn.textContent;
                    btn.textContent = '✓ 已复制';
                    setTimeout(() => {
                        btn.textContent = originalText;
                    }, 2000);
                }).catch(err => {
                    console.error('Failed to copy:', err);
                    alert('复制失败，请手动复制');
                });
            }
        });

        // 页面加载时处理token
        window.addEventListener('load', () => {
            const token = getTokenFromURL();
            const provider = getProviderFromURL();
            
            updateProviderBadge(provider);
            
            if (token) {
                saveToken(token);
                document.getElementById('tokenDisplay').textContent = token;
                loadUserProfile(token);
            } else {
                document.getElementById('tokenDisplay').textContent = '未找到认证令牌';
            }
        });
    </script>
</body>
</html>
