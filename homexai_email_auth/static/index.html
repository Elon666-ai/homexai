<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeX AI - 邮箱认证系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 30px; }
        .link-group { display: flex; flex-direction: column; gap: 15px; }
        .link-btn {
            background: #667eea;
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s;
            font-weight: 500;
        }
        .link-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 HomeX AI<br>邮箱认证系统</h1>
        <div class="link-group">
            <a href="/register" class="link-btn">📝 注册账户</a>
            <a href="/login" class="link-btn">🔑 登录账户</a>
            <a href="/forgot-password" class="link-btn">🔄 忘记密码</a>
        </div>
    </div>
</body>
</html>
