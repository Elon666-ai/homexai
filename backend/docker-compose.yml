version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: homex-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: homexai_master
      MYSQL_USER: homex
      MYSQL_PASSWORD: homex_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - homex-network

  redis:
    image: redis:7-alpine
    container_name: homex-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - homex-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homex-backend
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - DB_MASTER_HOST=mysql
      - DB_MASTER_PORT=3306
      - DB_MASTER_NAME=homexai_master
      - DB_MASTER_USER=homex
      - DB_MASTER_PASSWORD=homex_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mysql
      - redis
    networks:
      - homex-network
    volumes:
      - ./uploads:/app/uploads
    command: ./bin/homex-api

volumes:
  mysql_data:
  redis_data:

networks:
  homex-network:
    driver: bridge
