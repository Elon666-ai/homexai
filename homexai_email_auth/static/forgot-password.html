<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>忘记密码 - HomeX AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: white; border-radius: 20px; padding: 40px; max-width: 450px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h2 { color: #333; margin-bottom: 15px; text-align: center; }
        p { color: #666; margin-bottom: 25px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: #666; font-weight: 500; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; }
        input:focus { outline: none; border-color: #667eea; }
        button { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; }
        button:hover { background: #5568d3; }
        .status { padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .status.error { background: #fee; color: #c33; display: block; }
        .status.success { background: #efe; color: #3c3; display: block; }
        .links { text-align: center; margin-top: 20px; }
        .links a { color: #667eea; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔄 重置密码</h2>
        <p>输入您的邮箱地址，我们将发送密码重置链接</p>
        <div id="status" class="status"></div>
        <form id="forgotForm">
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="email" required>
            </div>
            <button type="submit">发送重置链接</button>
        </form>
        <div class="links">
            <a href="/login">返回登录</a>
        </div>
    </div>
    <script>
        const API = 'http://localhost:8080';
        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            try {
                const res = await fetch(`${API}/auth/request-reset`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: document.getElementById('email').value})
                });
                const data = await res.json();
                showStatus(data.message, 'success');
            } catch (e) {
                showStatus('发送失败', 'error');
            }
        });
        function showStatus(msg, type) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = `status ${type}`;
        }
    </script>
</body>
</html>
