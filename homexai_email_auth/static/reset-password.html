<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>重置密码 - HomeX AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: white; border-radius: 20px; padding: 40px; max-width: 450px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h2 { color: #333; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: #666; font-weight: 500; }
        input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; }
        input:focus { outline: none; border-color: #667eea; }
        button { width: 100%; padding: 14px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; }
        button:hover { background: #5568d3; }
        .status { padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .status.error { background: #fee; color: #c33; display: block; }
        .status.success { background: #efe; color: #3c3; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 设置新密码</h2>
        <div id="status" class="status"></div>
        <form id="resetForm">
            <div class="form-group">
                <label>新密码</label>
                <input type="password" id="password" minlength="6" required>
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="confirmPassword" minlength="6" required>
            </div>
            <button type="submit">重置密码</button>
        </form>
    </div>
    <script>
        const API = 'http://localhost:8080';
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            showStatus('无效的重置链接', 'error');
        }
        
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const pwd = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            
            if (pwd !== confirm) {
                return showStatus('两次密码输入不一致', 'error');
            }
            
            try {
                const res = await fetch(`${API}/auth/reset-password`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({token, new_password: pwd})
                });
                const data = await res.json();
                if (res.ok) {
                    showStatus('密码重置成功！', 'success');
                    setTimeout(() => location.href = '/login', 2000);
                } else {
                    showStatus(data.error, 'error');
                }
            } catch (e) {
                showStatus('重置失败', 'error');
            }
        });
        
        function showStatus(msg, type) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = `status ${type}`;
        }
    </script>
</body>
</html>
